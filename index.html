<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1C36">
<meta name="description" content="Sufra : partagez l'iftar. Personne ne devrait rompre le jeûne seul.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sufra">
<title>Sufra · Partageons l'iftar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B1C36'/%3E%3Ccircle cx='50' cy='52' r='34' fill='%23C99A45'/%3E%3Ccircle cx='62' cy='45' r='29' fill='%230B1C36'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Parisienne&family=Amiri:wght@700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>

<style>
:root{
  --cream:#FAF5EC;--sand:#F2E8D8;--card:#FFFFFF;--line:#EADFCD;--ink:#18233A;--muted:#6B6457;
  --navy:#13294B;--navy-2:#0B1C36;--gold:#C99A45;--gold-2:#E2BD72;--gold-soft:#F6EAD2;--gold-ink:#8A6418;
  --green:#2E8B57;--green-soft:#E3F2E8;--red:#B0412E;--red-soft:#F8E4DF;
  --title:"Montserrat",system-ui,sans-serif;--body:"Nunito Sans",system-ui,-apple-system,sans-serif;--script:"Parisienne",cursive;--arabic:"Amiri",serif;
  --r:18px;--shadow:0 1px 2px rgba(19,41,75,.06),0 10px 28px -16px rgba(19,41,75,.3);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:var(--cream)}
.view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.pad{padding:0 18px}
.bar-top{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 12px;position:sticky;top:0;background:var(--cream);z-index:3}
.bar-top h1{font-family:var(--title);font-weight:600;font-size:19px;color:var(--navy);margin:0;flex:1}
.back{width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--navy);margin-left:-8px}
.back svg{width:22px;height:22px}
.wordmark{font-family:var(--title);font-weight:700;letter-spacing:.2em;color:var(--navy);line-height:1}
svg.logo{display:block}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px;position:relative}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--navy)}
.nav button.on::before{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.nbadge{position:absolute;top:0;right:calc(50% - 22px);background:var(--gold);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:800}

/* communs */
.btn{border:0;background:var(--navy);color:#fff;border-radius:14px;padding:15px 16px;font-weight:800;width:100%;font-size:15px;display:flex;justify-content:center;align-items:center;gap:8px}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--navy-2)}
.btn.ghost{background:var(--sand);color:var(--navy)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--navy)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:10px 12px;font-size:13.5px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px}
.sect h3{font-family:var(--title);font-weight:600;font-size:17px;color:var(--navy);margin:0}
.sect button{background:none;border:0;font-size:13px;color:var(--gold-ink);font-weight:800}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.panel h4{font-family:var(--title);font-weight:600;font-size:15px;color:var(--navy);margin:0 0 12px}
.tagv{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:99px;padding:3px 9px;white-space:nowrap}
.tagv svg{width:13px;height:13px}
.tg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--sand);color:var(--navy);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.notice{display:flex;gap:10px;background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.notice svg{flex:none;width:18px;height:18px;color:var(--gold-ink);margin-top:1px}
.notice.err{background:var(--red-soft);color:var(--red)}
.notice.ok{background:var(--green-soft);color:var(--green)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--title);font-weight:700;color:#fff;flex:none;font-size:17px;background:var(--navy)}
.av.lg{width:72px;height:72px;font-size:28px}
.av.sq{border-radius:12px}
.av svg{width:22px;height:22px}
.stars{color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:28px 18px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-family:var(--title);font-weight:600;color:var(--navy);margin-bottom:4px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.status{font-size:11.5px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap}
.st-wait{background:var(--gold-soft);color:var(--gold-ink)}
.st-ok{background:var(--green-soft);color:var(--green)}
.st-no{background:var(--red-soft);color:var(--red)}
.st-host{background:var(--sand);color:var(--navy)}

/* onboarding */
.onb{min-height:100vh;display:flex;flex-direction:column;color:#fff;background:linear-gradient(180deg,#0B1C36 0%,#1B3360 45%,#7A5A55 72%,#C9874A 88%,#2A1B12 100%)}
.onb-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(36px + env(safe-area-inset-top,0px)) 30px 30px;text-align:center}
.onb .wordmark{color:#fff;font-size:24px;letter-spacing:.32em;margin:10px 0 0 .32em}
.onb .slog{font-family:var(--title);font-weight:500;font-size:12.5px;opacity:.75;margin-top:6px}
.onb h2{font-family:var(--title);font-weight:500;font-size:18px;line-height:1.4;margin:30px 0 14px}
.hadith{font-size:12px;font-style:italic;opacity:.78;max-width:30ch;line-height:1.5;margin-bottom:28px;position:relative;padding-top:14px}
.hadith::before{content:"";position:absolute;top:0;left:50%;width:28px;height:1px;background:var(--gold-2);transform:translateX(-50%)}
.choices{display:grid;gap:10px;width:100%;max-width:300px}
.pill{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:99px;height:48px;width:100%;border:1px solid rgba(255,255,255,.45);background:none;color:#fff;font-family:var(--title);font-weight:600;font-size:14px}
.pill.gold{background:var(--gold-2);border-color:var(--gold-2);color:var(--navy-2)}
.pill svg{width:17px;height:17px}

/* auth */
.auth{padding:calc(28px + env(safe-area-inset-top,0px)) 22px 40px;max-width:420px;margin:0 auto}
.auth h2{font-family:var(--title);font-weight:600;font-size:24px;color:var(--navy);margin:18px 0 6px}
.seg2{display:flex;background:var(--sand);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg2 button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:800;font-size:13px;color:var(--muted)}
.seg2 button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* champs */
.field{display:grid;gap:7px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label,.lbl{font-size:13px;font-weight:800;color:var(--navy)}
.field input,.field select,.field textarea{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;font-size:16px}
.field textarea{resize:vertical;min-height:76px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:grid;gap:10px}
.opt button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center}
.opt b{display:block;color:var(--navy);font-family:var(--title);font-weight:600;font-size:14.5px}
.opt span{font-size:12.5px;color:var(--muted)}
.opt button.on{border-color:var(--gold);background:var(--gold-soft)}
.dishrow{display:flex;gap:6px;margin-bottom:6px}
.dishrow input{flex:1;min-width:0}
.x{border:1px solid var(--line);background:var(--cream);border-radius:12px;width:44px;flex:none}
.add{border:1.5px dashed var(--gold);background:none;color:var(--gold-ink);border-radius:12px;padding:10px;font-weight:800;width:100%}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--cream);width:max-content}
.stepper button{border:0;background:none;width:46px;height:44px;font-size:20px;color:var(--navy);font-weight:700}
.stepper output{min-width:34px;text-align:center;font-weight:800;font-size:16px;color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* accueil */
.hh{background:linear-gradient(180deg,var(--navy-2),var(--navy));color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 0}
.hh-row{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px}
.brand .wordmark{font-size:17px;color:#fff}
.loc{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:6px 11px;display:flex;align-items:center;gap:5px;max-width:55%}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc svg{width:14px;height:14px;flex:none}
.hh-greet{font-family:var(--title);font-weight:500;font-size:15px;opacity:.85;margin:14px 0 10px}
.hh-count{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;color:#fff;padding:0 0 14px;text-align:left}
.hh-mid{display:grid;flex:1}
.hh-mid .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.hh-mid .v{font-family:var(--title);font-weight:600;font-size:22px}
.hh-times{display:grid;gap:2px;font-size:11.5px;text-align:right;opacity:.85}
.hh-times b{color:var(--gold-2)}
.hh-prog{height:3px;background:rgba(255,255,255,.12);margin:0 -18px}
.hh-prog i{display:block;height:100%;background:var(--gold-2);width:0}
.acts{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.act{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;padding:13px 8px;color:var(--navy)}
.act+.act{border-left:1px solid var(--line)}
.act .ai{width:28px;height:28px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.act .ai svg{width:15px;height:15px}
.act b{font-family:var(--title);font-weight:600;font-size:12.5px;text-align:left}
.dua{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--card);text-align:center}
.dua-k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:800}
.dua-ar{font-family:var(--arabic);font-size:21px;color:var(--navy);line-height:1.8;margin:8px 0 4px}
.dua-fr{font-size:13px;font-style:italic}
.dua-fr span{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:4px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left}
.list button+button{border-top:1px solid var(--line)}
.list .ic{width:34px;height:34px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.list .ic svg{width:18px;height:18px}
.list b{display:block;font-size:14px;color:var(--navy)}
.list small{font-size:12px;color:var(--muted)}
.list .arr{margin-left:auto;color:var(--muted);font-size:20px}
.sign{font-family:var(--script);color:var(--gold);font-size:22px;text-align:center;margin:22px 0 4px}

/* explorer */
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pills button,.pills label{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--navy);position:relative}
.pills .on{background:var(--navy);border-color:var(--navy);color:#fff}
.pills input[type=date]{position:absolute;inset:0;opacity:0}
.kinds{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:12px}
.kinds button{border:0;background:none;padding:10px 0;font-weight:800;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.kinds button.on{color:var(--navy);border-color:var(--gold)}
.mapwrap{position:relative;margin:12px 0;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);height:300px;transition:height .25s ease;isolation:isolate}
.mapwrap.big{height:calc(100vh - 230px);min-height:420px}
#map{position:absolute;inset:0;background:#F2EFE9;z-index:0;font-family:var(--body)}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-bottom-right{right:auto;left:0}
.pin2{border:0;background:none;padding:0;cursor:pointer}
.mapctl{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapctl>button,.mapctl .zoom{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:0;border-radius:12px;box-shadow:0 2px 10px rgba(19,41,75,.18);color:var(--navy)}
.mapctl>button{width:40px;height:40px;display:grid;place-items:center}
.mapctl>button svg{width:19px;height:19px}
.mapctl .zoom{display:flex;flex-direction:column;overflow:hidden}
.mapctl .zoom button{width:40px;height:40px;border:0;background:none;font-size:22px;font-weight:600;color:var(--navy)}
.mapctl .zoom button+button{border-top:1px solid var(--line)}
.map-card{position:absolute;left:10px;right:60px;bottom:10px;z-index:500}
.map-card .item{margin:0;box-shadow:0 8px 24px rgba(19,41,75,.25)}
.pin2{position:relative;width:40px;height:46px;display:grid;justify-items:center;transition:transform .15s ease;transform-origin:50% 100%}
.pin2::before{content:"";position:absolute;top:0;left:2px;width:36px;height:36px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);box-shadow:0 3px 8px rgba(11,28,54,.35);border:2.5px solid #fff;box-sizing:border-box;top:2px}
.pin2-ic{position:relative;width:36px;height:36px;display:grid;place-items:center;color:#fff;top:2px}
.pin2-ic svg{width:17px;height:17px}
.pin2-n{position:absolute;top:-4px;right:-2px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#fff;color:var(--navy);font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pin2.on{transform:scale(1.22)}
.pin2.on::before{border-color:var(--gold-2)}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2F7BEA;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);position:relative}
.me-dot::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:rgba(47,123,234,.25);animation:pulse 2s ease-out infinite;z-index:-1}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.me-dot::after{animation:none}}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px;width:100%;text-align:left;box-shadow:var(--shadow);align-items:flex-start}
.item .ph{width:72px;height:72px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff}
.item .ph svg{width:30px;height:30px}
.item .tx{flex:1;min-width:0;display:grid;gap:4px}
.item b{font-family:var(--title);font-weight:600;font-size:15px;color:var(--navy)}
.ln{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}
.ln span{display:inline-flex;gap:4px;align-items:center}
.ln svg{width:14px;height:14px;color:var(--navy)}
.ln.m{color:var(--muted)}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* détail */
.dhero{height:190px;position:relative;display:flex;align-items:flex-end;padding:16px 18px;color:#fff}
.dhero .rb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(11,28,54,.75);color:#fff;display:grid;place-items:center}
.dhero .rb svg{width:20px;height:20px}
.dhero .rb.l{left:14px}.dhero .rb.r{right:14px}
.dhero .rb.r.on{background:var(--gold);color:var(--navy-2)}
.dhero h2{font-family:var(--title);font-weight:600;font-size:24px;margin:0;position:relative;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.dmeta{display:grid;gap:10px;margin:16px 0}
.dmeta .r{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.dmeta svg{width:18px;height:18px;color:var(--navy);flex:none}
.course{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;margin:0}
.course dt{color:var(--gold-ink);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.course dd{margin:0 0 6px}
.hostbox{display:flex;align-items:center;gap:12px}
.hostbox b{font-family:var(--title);font-weight:600;color:var(--navy)}
.review{font-size:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.review:first-of-type{border-top:0;padding-top:0;margin-top:0}
.dcta{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:14px 0 6px;background:linear-gradient(transparent,var(--cream) 30%)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(11,28,54,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--cream);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet,.toast{animation:none!important}}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:10px auto 14px}
.sheet h2{font-family:var(--title);font-weight:600;font-size:21px;color:var(--navy);margin:0 0 4px}
.sheet .lead{color:var(--muted);font-size:14px;margin:0 0 16px}

/* réservations */
.req{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;display:grid;gap:12px;box-shadow:var(--shadow)}
.req .h{display:flex;gap:12px;align-items:center}
.req .h b{font-family:var(--title);font-weight:600;color:var(--navy);display:block}
.req .h .status{margin-left:auto}
.guest{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:12px}
.guest .av{width:36px;height:36px;font-size:14px}
.progress{height:7px;border-radius:7px;background:var(--sand);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold));border-radius:7px}
.tier{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.tier .tn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--sand);color:var(--muted);flex:none}
.tier b{display:block;font-size:13.5px;color:var(--navy)}
.tier span{font-size:12px;color:var(--muted)}
.tier .ts{margin-left:auto;font-size:11.5px;font-weight:800;white-space:nowrap}
.tier.done .tn{background:var(--green);color:#fff}.tier.done .ts{color:var(--green)}
.tier.ready{border-color:var(--gold)}.tier.ready .tn{background:var(--gold);color:#fff}
.tier.lock{opacity:.75}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;min-height:240px;padding:4px 0 12px}
.msg{max-width:80%;padding:10px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--navy);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.compose{display:flex;gap:8px;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--cream);padding:8px 0}
.compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 13px;font-size:16px}
.compose button{width:48px;border:0;border-radius:14px;background:var(--gold);color:var(--navy-2);display:grid;place-items:center}
.compose svg{width:18px;height:18px}

/* calendrier */
.cal-head,.cday{display:grid;grid-template-columns:40px 1fr 52px 62px 56px;gap:6px;align-items:center;padding:0 12px}
.cal-head{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-bottom:6px}
.cal-head span:nth-child(n+3),.cday span:nth-child(n+3){text-align:right}
.callist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cday{padding-block:10px;font-size:13px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.cday:first-child{border-top:0}
.cday .n{font-family:var(--title);font-weight:600;color:var(--navy)}
.cday .m{font-weight:800;color:var(--navy)}
.cday .d{color:var(--muted)}
.cday.past{opacity:.5}
.cday.today{background:var(--navy);color:#fff}
.cday.today .n,.cday.today .m{color:var(--gold-2)}
.cday.today .d{color:rgba(255,255,255,.75)}
.cday.last .n{color:var(--gold-ink)}

/* profil */
.prof{display:flex;gap:16px;align-items:center;padding:4px 0 14px}
.prof h2{font-family:var(--title);font-weight:600;font-size:22px;color:var(--navy);margin:0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:800;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 40px);width:max-content;text-align:center;animation:tup .25s}

.map-card .tags,.map-card .ln.m{display:none}.map-card .item .ph{width:56px;height:56px}
/* iOS : les champs date et heure ont une largeur et une hauteur propres à Safari, on les aligne sur les autres champs */
.row2>*{min-width:0}

.pills input[type=date]{-webkit-appearance:none;appearance:none}

const SUPABASE_URL = "https://nrhikltszevayxvsvbbi.supabase.co";

const $ = (s, r = document) => r.querySelector(s);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const pad2 = (n) => String(n).padStart(2, "0");
const isoDay = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => isoDay(new Date());
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoDay(d); };
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
function dayLabel(iso) {
  if (iso === today()) return "Aujourd'hui";
  if (iso === addDays(today(), 1)) return "Demain";

  return `${JOURS[d.getDay()][0].toUpperCase() + JOURS[d.getDay()].slice(1)} ${d.getDate()} ${MOIS[d.getMonth()]}`;
}
const hhmm = (t) => (t || "").slice(0, 5);
const km = (d) => (d < 1 ? `${Math.round(d * 1000 / 50) * 50} m` : `${d.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} km`);
function dist(a, b, c, d) {
  const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(x));
}
function toast(m) {

  if (/Failed to fetch|NetworkError/i.test(m)) return "Pas de connexion. Vérifiez votre réseau.";
  return m;
}

/* ---------- horaires de prière (Fajr 12°, Maghrib au coucher du soleil) ---------- */
function prayer(iso, lat, lng) {
  const d = new Date(iso + "T12:00:00");
  const start = new Date(d.getFullYear(), 0, 0), N = Math.round((d - start) / 864e5);
  const tz = -d.getTimezoneOffset() / 60, r = Math.PI / 180;
  const B = 2 * Math.PI * (N - 81) / 364, eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const dec = 23.45 * Math.sin(2 * Math.PI * (284 + N) / 365) * r, la = lat * r;
  const noon = 12 + tz - lng / 15 - eot / 60;
  const H = (alt) => Math.acos((Math.sin(alt * r) - Math.sin(la) * Math.sin(dec)) / (Math.cos(la) * Math.cos(dec))) / r / 15;
  return { fajr: noon - H(-12), maghrib: noon + H(-0.833) };
}
const fmtH = (h) => { const m = Math.round(h * 60); return `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`; };

/* ---------- icônes ---------- */

const logo = (fg = "#13294B", size = 76) => `<svg class="logo" width="${size}" height="${size}" viewBox="0 0 100 100" aria-label="Sufra" role="img"><defs><mask id="cres${size}"><rect width="100" height="100" fill="#fff"/><circle cx="64" cy="42" r="37" fill="#000"/></mask></defs><circle cx="50" cy="52" r="44" fill="#C99A45" mask="url(#cres${size})"/><path d="M53 47 C53 38 58 30 67 23" fill="none" stroke="${fg}" stroke-width="2" stroke-linecap="round"/><g fill="${fg}"><ellipse cx="49" cy="39" rx="2.8" ry="6.2" transform="rotate(-38 49 39)"/><ellipse cx="59.5" cy="38.5" rx="2.8" ry="6.2" transform="rotate(52 59.5 38.5)"/><ellipse cx="53.5" cy="29.5" rx="2.6" ry="5.8" transform="rotate(-30 53.5 29.5)"/><ellipse cx="64.5" cy="30" rx="2.6" ry="5.8" transform="rotate(60 64.5 30)"/><ellipse cx="68.5" cy="21" rx="2.4" ry="5.2" transform="rotate(35 68.5 21)"/><rect x="34" y="48" width="38" height="7" rx="2"/><path d="M39 57 h28 l-3 5 h-22z"/><rect x="42" y="63" width="8" height="17" rx="1.5"/><rect x="56" y="63" width="8" height="17" rx="1.5"/></g></svg>`;

/* ---------- navigation ---------- */
const TABS = ["home", "explore", "cal", "resa", "me"];
function go(view, params = {}, push = true) {
  if (push && S.view && !TABS.includes(view)) S.stack.push([S.view, S.params]);
  if (TABS.includes(view)) S.stack = [];

/* ---------- feuilles (bottom sheets) ---------- */

/* Position : GPS précis, ou adresse saisie à la main (Base Adresse Nationale) */

async function reverseLabel(lat, lng) {
  try {
    const r = await fetch(`https://api-adresse.data.gouv.fr/reverse/?lon=${lng}&lat=${lat}&limit=1`).then((x) => x.json());
    const f = r.features?.[0]?.properties; if (f) return f.street ? `${f.street}, ${f.city}` : f.city;
  } catch (_) {}
  return "Ma position";
}
function gps(silent) {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { if (!silent) toast("Localisation indisponible sur cet appareil."); return resolve(false); }
    navigator.geolocation.getCurrentPosition(async (p) => {
      setPos(p.coords.latitude, p.coords.longitude, await reverseLabel(p.coords.latitude, p.coords.longitude), "gps");
      if (!silent) toast(p.coords.accuracy > 1000 ? "Position approximative : activez la position précise" : "Position mise à jour");
      resolve(true);
    }, (e) => {
      if (!silent) toast(e.code === 1 ? "Localisation refusée : autorisez-la dans Réglages" : "Position introuvable, saisissez votre adresse");
      resolve(false);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

async function enrich(rows) {
  const hostIds = [...new Set(rows.map((r) => r.host_id))], partIds = [...new Set(rows.map((r) => r.partner_id).filter(Boolean))];
  const [h, p, rv] = await Promise.all([
    hostIds.length ? sb.from("profiles").select("id,first_name,id_verified").in("id", hostIds) : { data: [] },
    partIds.length ? sb.from("partners").select("id,name,kind,address").in("id", partIds) : { data: [] },
    hostIds.length ? sb.from("reviews").select("target_id,rating").in("target_id", hostIds) : { data: [] },
  ]);
  const H = Object.fromEntries((h.data || []).map((x) => [x.id, x])), P = Object.fromEntries((p.data || []).map((x) => [x.id, x]));
  const R = {}; (rv.data || []).forEach((x) => { (R[x.target_id] ||= []).push(x.rating); });
  return rows.map((l) => ({ ...l, host: H[l.host_id], partner: P[l.partner_id], rating: R[l.host_id] ? R[l.host_id].reduce((a, b) => a + b, 0) / R[l.host_id].length : null, nRev: R[l.host_id]?.length || 0, dist: l.approx_lat != null ? dist(S.pos.lat, S.pos.lng, l.approx_lat, l.approx_lng) : null }));

function askSheet(l) {

  const bg = sheet(`<h2>${pro ? "Inscription" : "Ma demande"}</h2><p class="lead">${esc(titleOf(l, l.host, l.partner))} · ${dayLabel(l.iftar_date)} · ${hhmm(l.arrival_time)}</p>
    <form id="askF"><div class="panel">
      <div class="field"><span class="lbl">Pour qui ?</span><div class="seg2" id="forSeg" style="margin:0"><button type="button" class="on" data-for="me">Pour moi</button><button type="button" data-for="other">Pour un proche</button></div></div>
      <div id="forOther" hidden><div class="row2"><div class="field"><label for="oName">Prénom du proche</label><input id="oName" maxlength="40"></div><div class="field"><label for="oLink">Lien</label><select id="oLink"><option>Ma mère</option><option>Mon père</option><option>Un voisin</option><option>Une amie</option><option>Autre</option></select></div></div>
        <div class="field"><label for="oPhone">Son téléphone (facultatif)</label><input id="oPhone" inputmode="tel" maxlength="20"></div></div>

      ${pro ? "" : `<div class="field"><label for="askMsg">Présentez-vous</label><textarea id="askMsg" maxlength="600">Salam aleykoum ! Ce serait un plaisir de rompre le jeûne avec vous.</textarea></div>
      <div class="field"><label for="askBring">J'apporte</label><select id="askBring"><option>Des dattes</option><option>Des pâtisseries</option><option>Une boisson</option><option value="">Rien, merci</option></select></div>`}
      <div class="field"><label for="askAll">Allergies ou régime</label><input id="askAll" maxlength="200"></div>
    </div><button class="btn gold" type="submit">${pro ? "Confirmer" : "Envoyer ma demande"}</button></form>`);

    e.preventDefault();

  const listHTML = data?.length ? data.map((l) => {
    const bks = (l.bookings || []).filter((b) => !["annulee"].includes(b.status)).sort((a, b) => (a.status === "en_attente" ? -1 : 1));
    return `<div class="req"><div class="h"><div><b>${l.format === "plat" ? "Mon plat à partager" : l.kind === "habitant" ? "Ma table" : "Iftar collectif"}</b><span class="hint">${dayLabel(l.iftar_date)} · ${hhmm(l.arrival_time)} · ${l.taken}/${l.places} ${l.format === "plat" ? "parts" : "places"}</span></div><span class="status ${l.is_open ? "st-ok" : "st-host"}">${l.is_open ? "Publiée" : "Fermée"}</span></div>
      ${bks.length ? bks.map((b) => `<div class="guest"><div class="av">${esc((b.guest?.first_name || "?")[0])}</div><div style="flex:1;min-width:0"><b>${esc(b.guest?.first_name || "Invité")}</b> <span class="hint">· ${b.party_size} pers.${b.guest?.id_verified ? " · vérifié" : ""}</span>
        ${b.for_relative ? `<div class="hint">Pour ${esc(b.for_relative.name)} (${esc(b.for_relative.link)})</div>` : ""}
        ${b.message ? `<div style="font-size:13.5px;margin-top:4px">${esc(b.message)}</div>` : ""}
        <div class="hint">${b.bring ? "Apporte : " + esc(b.bring.toLowerCase()) : ""}${b.allergies ? " · Allergies : " + esc(b.allergies) : ""}</div>
        <div class="row" style="margin-top:8px">${b.status === "en_attente" ? `<button class="btn gold sm" type="button" data-acc="${b.id}">Accepter</button><button class="btn line sm" type="button" data-dec="${b.id}">Refuser</button>` : `<span class="status ${STATUS[b.status][1]}" style="flex:none">${b.arrived_at ? "Arrivé" : STATUS[b.status][0]}</span>`}
        ${["en_attente", "acceptee"].includes(b.status) && l.kind === "habitant" ? `<button class="btn line sm" type="button" data-chat="${b.id}">${I.chat}</button>` : ""}
        ${b.status === "acceptee" && l.iftar_date <= today() && !reviewed.has(b.id) ? `<button class="btn ghost sm" type="button" data-review="${b.id}" data-target="${b.guest_id}">Avis</button>` : ""}</div></div></div>`).join("") : `<p class="hint" style="margin:0">Pas encore de demande.</p>`}
      ${l.is_open ? `<button class="btn line sm" type="button" data-close-l="${l.id}">Fermer les demandes</button>` : ""}</div>`;
  }).join("") : `<div class="empty"><b>Aucune table publiée</b>Ouvrez votre table pour l'iftar.<br><br><button class="btn gold sm" type="button" data-go="host">J'ouvre ma table</button></div>`;
  $("#rBody").innerHTML = `<div id="rewards"></div>${listHTML}`;
  $$("[data-acc],[data-dec]").forEach((x) => x.onclick = async () => {
    x.disabled = true; const { error: e } = await sb.rpc("respond_booking", { p_booking: x.dataset.acc || x.dataset.dec, p_accept: !!x.dataset.acc });
    if (e) { x.disabled = false; return toast(errMsg(e)); } toast(x.dataset.acc ? "Demande acceptée, l'adresse est partagée" : "Demande refusée"); render();
  });
  $$("[data-chat]").forEach((x) => x.onclick = () => go("chat", { id: x.dataset.chat }));
  $$("[data-review]").forEach((x) => x.onclick = () => reviewSheet(x.dataset.review, x.dataset.target));
  $$("[data-close-l]").forEach((x) => x.onclick = async () => { const { error: e } = await sb.from("listings").update({ is_open: false }).eq("id", x.dataset.closeL); if (e) return toast(errMsg(e)); render(); });
  renderRewards();
}
async function renderRewards() {
  const [rw, gh, cl] = await Promise.all([sb.from("rewards").select("*").order("threshold"), sb.rpc("guests_hosted", { p_host: me() }), sb.from("reward_claims").select("reward_id").eq("host_id", me())]);
  const n = gh.data || 0, R = rw.data || [], C = new Set((cl.data || []).map((c) => c.reward_id));
  const next = R.find((r) => n < r.threshold), prev = [...R].reverse().find((r) => n >= r.threshold);
  const pct = next ? Math.round((n - (prev?.threshold || 0)) / (next.threshold - (prev?.threshold || 0)) * 100) : 100;
  const box = $("#rewards"); if (!box) return;
  box.innerHTML = `<div class="panel"><h4>Récompenses de l'hôte</h4><b class="num" style="color:var(--navy)">${n} invité${n > 1 ? "s" : ""} accueilli${n > 1 ? "s" : ""}</b>
    <div class="hint">${next ? `Plus que ${next.threshold - n} pour : ${esc(next.name)}` : "Tous les paliers sont atteints. Merci !"}</div>
    <div class="progress" style="margin:8px 0 4px"><i style="width:${pct}%"></i></div>
    ${R.map((r) => { const st = C.has(r.id) ? "done" : n >= r.threshold ? "ready" : "lock"; return `<div class="tier ${st}"><span class="tn num">${r.threshold}</span><div style="min-width:0"><b>${esc(r.name)}</b><span>${esc(r.sponsor_label || "")}</span></div>${st === "ready" ? `<button class="btn gold sm" type="button" data-claim="${r.id}" style="width:auto;margin-left:auto">Récupérer</button>` : `<span class="ts">${st === "done" ? "Reçu" : "Verrouillé"}</span>`}</div>`; }).join("")}
    <p class="hint" style="margin:10px 0 0">Cadeaux offerts par nos partenaires pour remercier les hôtes. Le repas reste un don.</p></div>`;
  $$("[data-claim]", box).forEach((x) => x.onclick = async () => { const { error } = await sb.rpc("claim_reward", { p_reward: x.dataset.claim }); if (error) return toast(errMsg(error)); toast("Cadeau réservé ! Nous vous contactons pour le retrait."); renderRewards(); });
}
function arriveSheet(id) {
  const c = S.profile?.trusted_contact || "";
  const bg = sheet(`<h2>Bien arrivé ?</h2><p class="lead">Confirmez l'arrivée pour rassurer vos proches.</p><form id="arF"><div class="field"><label for="arC">Proche à prévenir (facultatif)</label><input id="arC" maxlength="80" value="${esc(c)}" placeholder="Ex. : mon frère Karim"></div><button class="btn gold" type="submit">Confirmer l'arrivée</button></form>`);
  $("#arF", bg).onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.rpc("mark_arrived", { p_booking: id, p_contact: $("#arC").value.trim() || null }); if (error) return toast(errMsg(error)); closeSheet(); toast("Arrivée confirmée"); render(); };
}
function reviewSheet(bookingId, target) {
  let r = 5;
  const bg = sheet(`<h2>Votre avis</h2><p class="lead">Il aide la communauté à se faire confiance.</p><form id="rvF"><div class="field"><span class="lbl">Note</span><div class="chips" id="rvS">${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="chip ${n === 5 ? "on" : ""}" data-r="${n}">${"★".repeat(n)}</button>`).join("")}</div></div><div class="field"><label for="rvC">Commentaire</label><textarea id="rvC" maxlength="600"></textarea></div><button class="btn gold" type="submit">Publier</button></form>`);
  $$("#rvS [data-r]", bg).forEach((b) => b.onclick = () => { r = +b.dataset.r; $$("#rvS button").forEach((x) => x.classList.toggle("on", x === b)); });
  $("#rvF", bg).onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.from("reviews").insert({ booking_id: bookingId, author_id: me(), target_id: target, rating: r, comment: $("#rvC").value.trim() || null }); if (error) return toast(errMsg(error)); closeSheet(); toast("Merci pour votre avis"); render(); };
}
async function refreshPending() {
  if (!me()) return;
  const { count } = await sb.from("bookings").select("id, listings!inner(host_id)", { count: "exact", head: true }).eq("status", "en_attente").eq("listings.host_id", me());
  if ((count || 0) !== S.pending) { S.pending = count || 0; const n = $(".nav"); if (n) n.outerHTML = nav(); }
}

/* ---------- messagerie ---------- */
VIEWS.chat = {
  html: () => `${topbar("Messages")}<div class="pad"><div class="chat" id="chat">${loading()}</div>
    <form class="compose" id="cmp"><input id="cmsg" maxlength="1000" placeholder="Votre message" aria-label="Votre message" autocomplete="off"><button type="submit" aria-label="Envoyer">${I.send}</button></form></div>`,
  async mount() {
    const id = S.params.id;
    const { data: b } = await sb.from("bookings").select("*, listing:listings(host_id)").eq("id", id).single();
    const other = b ? (b.guest_id === me() ? b.listing.host_id : b.guest_id) : null;
    const { data: op } = other ? await sb.from("profiles").select("first_name").eq("id", other).single() : { data: null };
    if (op) $(".bar-top h1").textContent = op.first_name;
    const box = $("#chat"), seen = new Set();
    const add = (m) => { if (seen.has(m.id)) return; seen.add(m.id); const d = document.createElement("div"); d.className = "msg " + (m.sender_id === me() ? "me" : "them"); d.textContent = m.body; box.appendChild(d); window.scrollTo(0, document.body.scrollHeight); };
    const { data, error } = await sb.from("messages").select("*").eq("booking_id", id).order("created_at");
    if (error) return toast(errMsg(error));
    box.innerHTML = data.length ? "" : `<p class="hint" id="noMsg" style="text-align:center">Aucun message. Dites bonjour !</p>`;
    data.forEach(add);
    S.channel = sb.channel("msg-" + id).on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `booking_id=eq.${id}` }, (p) => { $("#noMsg")?.remove(); add(p.new); }).subscribe();
    $("#cmp").onsubmit = async (e) => {
      e.preventDefault(); const body = $("#cmsg").value.trim(); if (!body) return;
      $("#cmsg").value = "";
      const { data: m, error: er } = await sb.from("messages").insert({ booking_id: id, sender_id: me(), body }).select().single();
      if (er) { $("#cmsg").value = body; return toast(errMsg(er)); }
      $("#noMsg")?.remove(); add(m);
    };
  },
};

/* ---------- calendrier ---------- */
VIEWS.cal = {
  html: () => {
    const t = today(); let rows = "";
    for (let d = 1; d <= 30; d++) {
      const iso = addDays(RAMADAN_START, d - 1), p = prayer(iso, S.pos.lat, S.pos.lng), dt = new Date(iso + "T12:00:00");
      rows += `<div class="cday ${iso < t ? "past" : iso === t ? "today" : ""} ${d >= 21 ? "last" : ""}"><span class="n">${d}</span><span class="d">${JOURS[dt.getDay()].slice(0, 3)}. ${dt.getDate()} ${MOIS[dt.getMonth()].slice(0, 4)}.</span><span>${fmtH(p.fajr)}</span><span class="m">${fmtH(p.maghrib)}</span><span class="d">${Math.floor(p.maghrib - p.fajr)} h ${pad2(Math.round((p.maghrib - p.fajr) % 1 * 60))}</span></div>`;
    }
    const tp = prayer(t, S.pos.lat, S.pos.lng);
    return `${topbar("Ramadan 1448", false)}<div class="pad">
      <div class="panel"><h4>Aujourd'hui à ${esc(S.pos.label)}</h4><div class="row"><div><div class="hint">Fajr</div><b class="num" style="font-size:22px;color:var(--navy)">${fmtH(tp.fajr)}</b></div><div><div class="hint">Maghrib</div><b class="num" style="font-size:22px;color:var(--gold-ink)">${fmtH(tp.maghrib)}</b></div></div></div>
      <div class="notice">${I.moon}<span>Début estimé le <b>lundi 8 février 2027</b>. Les 10 dernières nuits commencent le 27 février. Aïd al-Fitr le 9 ou 10 mars, selon l'observation du croissant.</span></div>
      <div class="cal-head"><span>Jour</span><span>Date</span><span>Fajr</span><span>Maghrib</span><span>Jeûne</span></div>
      <div class="callist">${rows}</div>
      <p class="hint" style="text-align:center;margin-top:12px">Horaires calculés pour ${esc(S.pos.label)} (Fajr à 12°). Valeurs indicatives : fiez-vous aux horaires de votre mosquée.</p></div>`;
  },
};

/* ---------- profil ---------- */
VIEWS.me = {
  html: () => `${topbar("Mon profil", false)}<div class="pad"><div id="meBody">${loading()}</div></div>`,
  async mount() {
    const p = S.profile || {};
    const [{ data: parts }, { data: rv }] = await Promise.all([sb.from("partners").select("*").eq("owner_id", me()).order("created_at"), sb.from("reviews").select("rating").eq("target_id", me())]);
    const avg = rv?.length ? (rv.reduce((a, b) => a + b.rating, 0) / rv.length).toFixed(1).replace(".", ",") : null;
    const PS = { en_attente: ["En vérification", "st-wait"], verifie: ["Vérifié", "st-ok"], refuse: ["Refusé", "st-no"] };
    $("#meBody").innerHTML = `
      <div class="prof"><div class="av lg" style="background:linear-gradient(135deg,#C99A45,#8A6418)">${esc((p.first_name || "?")[0])}</div><div><h2>${esc(p.first_name)}</h2><div class="hint">${esc(S.session.user.email)}</div><div class="hint">${avg ? `<span class="stars">★</span> ${avg}/5 · ${rv.length} avis` : "Pas encore d'avis"}</div></div></div>
      <div class="panel"><h4>Vérifications</h4><div class="hint">${I.check.replace("<svg", '<svg style="width:14px;height:14px;color:var(--green);vertical-align:-2px"')} Email confirmé</div><div class="hint" style="margin-top:6px">${p.id_verified ? "Identité vérifiée" : "Vérification d'identité : bientôt disponible"}</div></div>
      <form class="panel" id="pF"><h4>Mes informations</h4>
        <div class="field"><label for="pN">Prénom</label><input id="pN" maxlength="40" value="${esc(p.first_name)}"></div>
        <div class="field"><label for="pC">Ville</label><input id="pC" maxlength="80" value="${esc(p.city)}"></div>
        <div class="field"><label for="pT">Contact de confiance</label><input id="pT" maxlength="80" value="${esc(p.trusted_contact)}" placeholder="Prévenu quand vous arrivez à un iftar"></div>
        <div class="field"><label for="pB">Quelques mots sur moi</label><textarea id="pB" maxlength="500">${esc(p.bio)}</textarea></div>
        <button class="btn" type="submit">Enregistrer</button></form>
      <div class="panel"><h4>Espace partenaire</h4>${parts?.length ? parts.map((x) => `<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><div class="av sq">${x.kind === "restaurant" ? I.shop : I.mosque}</div><div style="flex:1;min-width:0"><b style="color:var(--navy)">${esc(x.name)}</b><div class="hint">${esc(x.city)}</div></div><span class="status ${PS[x.status][1]}">${PS[x.status][0]}</span></div>`).join("") + (parts.some((x) => x.status === "verifie") ? `<button class="btn gold sm" type="button" data-go="host">Publier un iftar collectif</button>` : `<p class="hint" style="margin:0">Nous vérifions votre structure sous 48 h.</p>`) : `<p class="hint" style="margin:0 0 10px">Mosquée, association ou restaurant : publiez vos iftars avec le badge « Partenaire vérifié ».</p><button class="btn line sm" type="button" id="newPart">Créer un compte partenaire</button>`}</div>
      <button class="btn ghost" type="button" id="logout">Me déconnecter</button>
      <p class="hint" style="text-align:center;margin:16px 0">Sufra · version bêta</p>`;
    $("#pF").onsubmit = async (e) => {
      e.preventDefault();
      const upd = { first_name: $("#pN").value.trim(), city: $("#pC").value.trim() || null, trusted_contact: $("#pT").value.trim() || null, bio: $("#pB").value.trim() || null };
      if (!upd.first_name) return toast("Le prénom est requis.");
      const { error } = await sb.from("profiles").update(upd).eq("id", me()); if (error) return toast(errMsg(error));
      Object.assign(S.profile, upd); toast("Profil enregistré");
    };
    const np = $("#newPart"); if (np) np.onclick = partnerSheet;
    $("#logout").onclick = async () => { await sb.auth.signOut(); };
  },
};
function partnerSheet() {
  const bg = sheet(`<h2>Compte partenaire</h2><p class="lead">Vérifié par l'équipe Sufra sous 48 h.</p><form id="ptF">
    <div class="field"><label for="ptK">Vous êtes</label><select id="ptK"><option value="mosquee">Une mosquée</option><option value="association">Une association</option><option value="restaurant">Un restaurant</option><option value="sponsor">Une marque ou un commerçant (sponsor)</option></select></div>
    <div class="field"><label for="ptN">Nom</label><input id="ptN" maxlength="120" required></div>
    <div class="row2"><div class="field"><label for="ptC">Ville</label><input id="ptC" maxlength="80" required></div><div class="field"><label for="ptCap">Places par soir</label><input id="ptCap" type="number" min="1" max="5000" inputmode="numeric"></div></div>
    <div class="field"><label for="ptA">Adresse</label><input id="ptA" maxlength="200"></div>
    <div class="field"><label for="ptR">N° RNA ou SIRET</label><input id="ptR" maxlength="20"></div>
    <button class="btn gold" type="submit">Envoyer ma demande</button></form>`);
  $("#ptF", bg).onsubmit = async (e) => {
    e.preventDefault();
    const row = { owner_id: me(), kind: $("#ptK").value, name: $("#ptN").value.trim(), city: $("#ptC").value.trim(), address: $("#ptA").value.trim() || null, registry_id: $("#ptR").value.trim() || null, capacity: +$("#ptCap").value || null };
    if (row.name.length < 2 || !row.city) return toast("Nom et ville requis.");
    const { error } = await sb.from("partners").insert(row); if (error) return toast(errMsg(error));
    closeSheet(); toast("Demande envoyée"); render();
  };
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
async function loadProfile() {
  const { data, error } = await sb.from("profiles").select("*").eq("id", me()).maybeSingle();
  if (error) { toast(errMsg(error)); return; }
  S.profile = data || { id: me(), first_name: "", gender: null };
  const meta = S.session.user.user_metadata || {};
  if (data && !data.gender && meta.gender) {
    await sb.from("profiles").update({ gender: meta.gender, first_name: data.first_name || meta.first_name || "" }).eq("id", me());
    S.profile.gender = meta.gender;
  }
}
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === "INITIAL_SESSION" || event === "TOKEN_REFRESHED") { if (session) S.session = session; return; }
  const was = !!S.session; S.session = session;
  if (event === "PASSWORD_RECOVERY") {
    const bg = sheet(`<h2>Nouveau mot de passe</h2><form id="npF"><div class="field"><label for="npP">Mot de passe</label><input id="npP" type="password" minlength="6" autocomplete="new-password"></div><button class="btn gold" type="submit">Enregistrer</button></form>`);
    $("#npF", bg).onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: $("#npP").value }); if (error) return toast(errMsg(error)); closeSheet(); toast("Mot de passe modifié"); };
    return;
  }
  if (session && !was) {
    setTimeout(async () => {
      await loadProfile();
      const after = store.get("after", "home"); store.set("after", "home");
      S.stack = []; S.view = after === "host" ? "host" : after === "explore" ? "explore" : "home"; render(); refreshPending();
    }, 0);
  } else if (!session && was) { S.profile = null; S.stack = []; S.view = "auth"; render(); }
});
(async () => {
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (S.session) { await loadProfile(); S.view = "home"; refreshPending(); }
  if (!S.pos.src || (S.pos.src === "gps" && Date.now() - (S.pos.at || 0) > 6 * 3600e3)) gps(true).then((ok) => { if (ok && ["home", "explore"].includes(S.view)) render(); });
  else S.view = store.get("seen", false) ? "auth" : "onb";
  render();
})();

</script>
