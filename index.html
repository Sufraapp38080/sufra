    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast(perm === "denied" ? "Notifications bloquées dans les réglages du téléphone" : "Notifications non activées"); return false; }
    const reg = await swReg(); await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u8(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const { error } = await sb.rpc("save_push_subscription", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    if (error) { toast(errMsg(error)); return false; }
    toast("Notifications activées sur ce téléphone"); return true;
  } catch (e) { toast("Activation impossible : " + (e.message || e)); return false; }
}
async function disablePush() {

async function prepImg(file, mark) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error("img")); i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext("2d"); g.drawImage(img, 0, 0, c.width, c.height);
    if (mark) {
      const t = `SUFRA · VÉRIFICATION UNIQUEMENT · ${new Date().toLocaleDateString(locale())}`, fs = Math.max(14, Math.round(c.width / 26)), d = Math.hypot(c.width, c.height);
      g.save(); g.translate(c.width / 2, c.height / 2); g.rotate(-Math.PI / 7); g.font = `800 ${fs}px sans-serif`; g.textAlign = "center"; g.fillStyle = "rgba(201,154,69,.5)"; g.strokeStyle = "rgba(11,28,54,.25)"; g.lineWidth = 1;
      for (let y = -d / 2; y < d / 2; y += fs * 4) { g.fillText(t, 0, y); g.strokeText(t, 0, y); }
      g.restore();
    }
    return await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}

    const PS = { en_attente: ["En vérification", "st-wait"], verifie: ["Vérifié", "st-ok"], refuse: ["Refusé", "st-no"] };
    $("#meBody").innerHTML = `
      <div class="prof"><div class="av lg" style="background:linear-gradient(135deg,#C99A45,#8A6418)">${esc((p.first_name || "?")[0])}</div><div><h2>${esc(p.first_name)}</h2><div class="hint">${esc(S.session.user.email)}</div><div class="hint">${avg ? `<span class="stars">★</span> ${avg}/5 · ${rv.length} avis` : "Pas encore d'avis"}</div></div></div>
      ${idPanelHTML(p, idc?.[0])}
      ${await notifPanelHTML()}
      <div class="panel"><h4>Apparence</h4><div class="seg2" id="thSeg" style="margin:0">${[["auto", "Automatique"], ["light", "Clair"], ["dark", "Sombre"]].map(([k, n]) => `<button type="button" data-th="${k}" class="${store.get("theme", "auto") === k ? "on" : ""}">${n}</button>`).join("")}</div><p class="hint" style="margin:8px 0 14px">Automatique suit le réglage de votre téléphone.</p><span class="lbl">Langue</span><div class="seg2" id="lgSeg" style="margin:8px 0 0">${LANGS.map(([k, n]) => `<button type="button" data-lang="${k}" class="${lang() === k ? "on" : ""}" data-noi18n>${n}</button>`).join("")}</div></div>
      <form class="panel" id="pF"><h4>Mes informations</h4>
        <div class="field"><label for="pN">Prénom</label><input id="pN" maxlength="40" value="${esc(p.first_name)}"></div>
        <div class="field"><label for="pC">Ville</label><input id="pC" maxlength="80" value="${esc(p.city)}"></div>
        <div class="field"><label for="pT">Contact de confiance</label><input id="pT" maxlength="80" value="${esc(p.trusted_contact)}" placeholder="Prévenu quand vous arrivez à un iftar"></div>
        <div class="field"><label for="pB">Quelques mots sur moi</label><textarea id="pB" maxlength="500">${esc(p.bio)}</textarea></div>
        <button class="btn" type="submit">Enregistrer</button></form>
      <div class="panel"><h4>Espace partenaire</h4>${parts?.length ? parts.map((x) => `<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><div class="av sq">${x.kind === "restaurant" ? I.shop : I.mosque}</div><div style="flex:1;min-width:0"><b style="color:var(--navy)">${esc(x.name)}</b><div class="hint">${esc(x.city)}</div></div><span class="status ${PS[x.status][1]}">${PS[x.status][0]}</span></div>`).join("") + (parts.some((x) => x.status === "verifie") ? `<button class="btn gold sm" type="button" data-go="host">Publier un iftar collectif</button>` : `<p class="hint" style="margin:0">Nous vérifions votre structure sous 48 h.</p>`) : `<p class="hint" style="margin:0 0 10px">Mosquée, association ou restaurant : publiez vos iftars avec le badge « Partenaire vérifié ».</p><button class="btn line sm" type="button" id="newPart">Créer un compte partenaire</button>`}</div>
      <div class="panel"><h4>Mes données</h4><div class="list" style="border:0;margin:0 -14px"><button type="button" id="dlData"><span class="ic">${I.share}</span><span><b>Télécharger mes données</b><small>Une copie de tout ce que Sufra conserve sur vous</small></span><span class="arr">›</span></button><button type="button" data-go="legal"><span class="ic">${I.book}</span><span><b>CGU et confidentialité</b><small>Vos droits et nos engagements</small></span><span class="arr">›</span></button><button type="button" id="delAcc"><span class="ic danger-ic">${I.x}</span><span><b style="color:var(--red)">Supprimer mon compte</b><small>Définitif : annonces, demandes et messages compris</small></span><span class="arr">›</span></button></div></div>
      ${S.isAdmin ? `<button class="btn" type="button" data-go="admin" style="margin-bottom:10px">${I.shield} Espace admin</button>` : ""}
      <button class="btn ghost" type="button" id="logout">Me déconnecter</button>
      <p class="hint lg-links" style="text-align:center;margin:16px 0 4px">${legalLinks()}</p>
      <p class="hint" style="text-align:center;margin:0 0 16px">Sufra · version bêta</p>`;
    $("#pF").onsubmit = async (e) => {
      e.preventDefault();
      const upd = { first_name: $("#pN").value.trim(), city: $("#pC").value.trim() || null, trusted_contact: $("#pT").value.trim() || null, bio: $("#pB").value.trim() || null };
      if (!upd.first_name) return toast("Le prénom est requis.");
      const { error } = await sb.from("profiles").update(upd).eq("id", me()); if (error) return toast(errMsg(error));
      Object.assign(S.profile, upd); toast("Profil enregistré");
    };
    const np = $("#newPart"); if (np) np.onclick = () => partnerSheet();
    const ig = $("#idGo"); if (ig) ig.onclick = () => idSheet();
    bindNotifPanel();
    $("#dlData").onclick = exportData;
    $("#delAcc").onclick = deleteSheet;
    $$("[data-lang]").forEach((b) => b.onclick = () => setLang(b.dataset.lang));
    $$("[data-th]").forEach((b) => b.onclick = () => { store.set("theme", b.dataset.th); applyTheme(); $$("[data-th]").forEach((x) => x.classList.toggle("on", x === b)); });
    $("#logout").onclick = async () => { await sb.auth.signOut(); };
  },
};
function partnerSheet(pre = {}) {
  const bg = sheet(`<h2>Compte partenaire</h2><p class="lead">Vérifié par l'équipe Sufra sous 48 h.</p><form id="ptF">
    <div class="field"><label for="ptK">Vous êtes</label><select id="ptK"><option value="mosquee">Une mosquée</option><option value="association">Une association</option><option value="restaurant">Un restaurant</option><option value="sponsor">Une marque ou un commerçant (sponsor)</option></select></div>
    <div class="field"><label for="ptN">Nom</label><input id="ptN" maxlength="120" required value="${esc(pre.name || "")}"></div>
    <div class="row2"><div class="field"><label for="ptC">Ville</label><input id="ptC" maxlength="80" required value="${esc(pre.city || "")}"></div><div class="field"><label for="ptCap">Places par soir</label><input id="ptCap" type="number" min="1" max="5000" inputmode="numeric"></div></div>
    <div class="field"><label for="ptA">Adresse</label><input id="ptA" maxlength="200" value="${esc(pre.address || "")}"></div>
    <div class="field"><label for="ptR">N° RNA ou SIRET</label><input id="ptR" maxlength="20"></div>
    <button class="btn gold" type="submit">Envoyer ma demande</button></form>`);
  $("#ptF", bg).onsubmit = async (e) => {
    e.preventDefault();
    const row = { owner_id: me(), kind: $("#ptK").value, name: $("#ptN").value.trim(), city: $("#ptC").value.trim(), address: $("#ptA").value.trim() || null, registry_id: $("#ptR").value.trim() || null, capacity: +$("#ptCap").value || null };
    if (row.name.length < 2 || !row.city) return toast("Nom et ville requis.");
    const { error } = await sb.from("partners").insert(row); if (error) return toast(errMsg(error));
    closeSheet(); toast("Demande envoyée"); render();
  };
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
async function loadProfile() {
  setTimeout(startNotifs, 0);
  const { data, error } = await sb.from("profiles").select("*").eq("id", me()).maybeSingle();
  if (error) { toast(errMsg(error)); return; }
  S.profile = data || { id: me(), first_name: "", gender: null };
  try { const { data: ad } = await sb.from("admins").select("user_id").eq("user_id", me()).maybeSingle(); S.isAdmin = !!ad; } catch (_) { S.isAdmin = false; }
  const meta = S.session.user.user_metadata || {};
  if (data && !data.gender && meta.gender) {
    await sb.from("profiles").update({ gender: meta.gender, first_name: data.first_name || meta.first_name || "" }).eq("id", me());
    S.profile.gender = meta.gender;
  }
}
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === "INITIAL_SESSION" || event === "TOKEN_REFRESHED") { if (session) S.session = session; return; }
  const was = !!S.session; S.session = session;
  if (event === "PASSWORD_RECOVERY") {
    const bg = sheet(`<h2>Nouveau mot de passe</h2><form id="npF"><div class="field"><label for="npP">Mot de passe</label><input id="npP" type="password" minlength="6" autocomplete="new-password"></div><button class="btn gold" type="submit">Enregistrer</button></form>`);
    $("#npF", bg).onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: $("#npP").value }); if (error) return toast(errMsg(error)); closeSheet(); toast("Mot de passe modifié"); };
    return;
  }
  if (session && !was) {
    setTimeout(async () => {
      await loadProfile();
      const after = store.get("after", "home"); store.set("after", "home");
      S.stack = []; S.view = after === "host" ? "host" : after === "explore" ? "explore" : "home"; render(); refreshPending();
      const pl = store.get("pendingLink", null); if (pl && S.profile?.terms_version === LEGAL.version) { store.set("pendingLink", null); openLink(pl); }
    }, 0);
  } else if (!session && was) { stopNotifs(); S.profile = null; S.stack = []; S.view = "auth"; render(); }
});
(async () => {
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (S.session) { await loadProfile(); S.view = /[?&]v=/.test(location.search) ? "home" : "onb"; refreshPending(); }
  else S.view = store.get("seen", false) ? "auth" : "onb";
  if (!S.pos.src || (S.pos.src === "gps" && Date.now() - (S.pos.at || 0) > 6 * 3600e3)) gps(true).then((ok) => { if (ok && ["home", "explore"].includes(S.view)) render(); });
  render();
  if (S.session) openLink(location.search);
  else if (/[?&]v=/.test(location.search)) { store.set("pendingLink", location.search); try { history.replaceState(null, "", location.pathname); } catch (_) {} }
  if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener?.("message", (e) => { if (e.data?.type === "open" && S.session) openLink(e.data.url); });
})();

</script>
